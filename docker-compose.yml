  # ─────────────────────────────────────────
  # BASE DE DATOS — Mastercard
  # ─────────────────────────────────────────
  db_mastercard:
    image: postgres:15
    container_name: bd_mastercard
    environment:
      POSTGRES_USER:     mc_user
      POSTGRES_PASSWORD: mc_pass
      POSTGRES_DB:       mastercard_db
    ports:
      - "5442:5432"
    volumes:
      - pgdata_mastercard:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_user -d mastercard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

