  # ─────────────────────────────────────────
  # SERVICIO — Mastercard
  # ─────────────────────────────────────────
  servicio_mastercard:
    build:
      context: ./service-mastercard
      dockerfile: Dockerfile
    container_name: servicio_mastercard
    environment:
      FLASK_DEBUG: "true"
      FLASK_PORT:  3002
      DB_USER:     mc_user
      DB_PASSWORD: mc_pass
      DB_HOST:     db_mastercard
      DB_PORT:     5432          # ← interno siempre 5432
      DB_NAME:     mastercard_db
    ports:
      - "3002:3002"
    depends_on:
      db_mastercard:
        condition: service_healthy
